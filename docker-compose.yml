# ──────────────────────────────────────────────────────────────────────────────
# DocuCraft — Docker Compose
#
# Starts the full stack locally with one command:
#   docker compose up --build
#
# Services:
#   backend  → FastAPI on http://localhost:8000
#   frontend → React (via Nginx) on http://localhost:5173
#
# Prerequisites:
#   1. Copy backend/.env.example to backend/.env and fill in your keys
#   2. docker compose up --build
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docucraft-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env          # GROQ_API_KEY, SECRET_KEY, DATABASE_URL
    environment:
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the frontend at the local backend during build
        VITE_API_URL: "http://localhost:8000"
    container_name: docucraft-frontend
    ports:
      - "5173:80"               # Access at http://localhost:5173
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
