services:
  - type: web
    name: docucraft-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false        # This means Render will ask you to fill it in the dashboard manually (keeps your key secret)
    plan: free
